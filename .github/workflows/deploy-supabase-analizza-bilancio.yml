name: Deploy analizza-bilancio

on:
  push:
    branches:
      - main
    paths:
      - "supabase/functions/analizza-bilancio/**"
      - "supabase/functions/_shared/**"
      - "supabase/config.toml"
      - ".github/workflows/deploy-supabase-analizza-bilancio.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-supabase-analizza-bilancio
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Edge Function
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: fhieppjqlefdlanvrpik
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy analizza-bilancio
        run: supabase functions deploy analizza-bilancio --project-ref "$SUPABASE_PROJECT_REF"
